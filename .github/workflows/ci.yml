name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Analyze, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Firebase config is git-ignored; the placeholder template is enough to
      # compile, analyze and run the (Firebase-free) tests.
      - name: Use placeholder Firebase config
        run: cp lib/firebase_options.example.dart lib/firebase_options.dart

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

      # The Google services Gradle plugin needs a google-services.json; a
      # placeholder keeps the build honest without real keys.
      - name: Write placeholder google-services.json
        run: |
          cat > android/app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "placeholder",
              "storage_bucket": "placeholder.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                "android_client_info": { "package_name": "com.lakshya.habitual_offender" }
              },
              "oauth_client": [],
              "api_key": [{ "current_key": "placeholder" }],
              "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
            }],
            "configuration_version": "1"
          }
          EOF

      - run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: apk-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 14
